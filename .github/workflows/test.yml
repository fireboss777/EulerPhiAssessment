name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned: the pipeline now includes `forge snapshot --check`, which
          # compares gas codegen — a toolchain bump can change generated gas
          # and turn the pipeline red for a reason unrelated to this code.
          version: v1.5.1

      - name: Show Forge version
        run: forge --version

      # Dependencies are Soldeer-managed (forge-std + solady), not git submodules.
      - name: Install Soldeer dependencies
        run: forge soldeer install

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

      # .gas-snapshot is the cost baseline the README table is derived from;
      # without this step the snapshot silently drifts and the "pins costs"
      # claim in the README is untrue.
      - name: Check gas snapshot
        run: forge snapshot --check
